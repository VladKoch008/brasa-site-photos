services:
  - type: web
    name: brasa-site-photos
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py serve --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /api/menu
    envVars:
      - key: BRASA_SECURE_COOKIES
        value: "1"
